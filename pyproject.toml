[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgfanout"
dynamic = ["version"]
description = "Parallel logical dump/restore for PostgreSQL that streams to S3 or local disk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["postgresql", "pg_dump", "pg_restore", "backup", "s3", "parallel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3,server]>=5.0",
]

[project.urls]
Homepage = "https://github.com/jsc0218/pgfanout"
Source = "https://github.com/jsc0218/pgfanout"
Issues = "https://github.com/jsc0218/pgfanout/issues"

[project.scripts]
pgfanout-dump = "pgfanout.parallel_dump:main"
pgfanout-restore = "pgfanout.parallel_restore:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pgfanout.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = [
    "E501", # line too long; guidance rather than a hard failure
]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
    "W",  # pycodestyle
    "B",  # bugbear
    "UP", # pyupgrade
    "TC", # flake8-type-checking
]
