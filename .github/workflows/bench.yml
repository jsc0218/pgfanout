name: Benchmark

# Compares a pull request against its base branch for dump and restore speed.
#
# What it does
#   Builds the base branch and the PR into separate virtualenvs and runs
#   bench/bench.py on both in one job, against one PostgreSQL service
#   container, at 1 and 2 jobs, together with pg_dump -j 1 as a reference:
#   first dumping to local disk, then through S3 (a local versitygw). Rounds
#   are interleaved with the order rotated, and a warm-up round is discarded,
#   so noise on the shared runner hits every variant equally. bench/compare.py
#   writes a table per run to the job summary and flags a PR that is slower
#   than the base at 2 jobs by more than 5% (and by more than 0.2s) on the
#   median of 5 rounds, in either run. It also shows the PR's speedup over one
#   job, which never gates.
#
# Why it can be trusted, and where it cannot
#   * It is built to catch regressions, not to produce absolute numbers. The
#     harness tunes the server for repeatability: it raises max_wal_size and
#     checkpoint_timeout (a restore writes about as much WAL as it loads, and
#     a checkpoint part-way through was the main source of restore noise),
#     runs CHECKPOINT + sync before every timed command, and turns fsync off
#     (local servers only) so the result does not depend on the runner's disk.
#     All of it is reset afterwards, with a flush of what was written while
#     fsync was off. Do not publish numbers from this job; use bench.py with
#     --keep-fsync on a dedicated machine for those.
#   * Measured on identical code (this workflow compares identical builds
#     whenever a PR does not touch src/): over the 18 such runs since the
#     harness settled (22-25 Nov 2026), base and PR differed by 0.4% at the
#     median on restore (at most 1.3%, 0.03s) and 2.0% on dump (at most 5.8%,
#     0.18s). Absolute times move by 15% or more between jobs because each job
#     lands on a different VM, which is why only the in-job comparison means
#     anything. Restore therefore has a wide margin under a 5% threshold. Dump
#     does not: two of those 18 runs were over 5% on identical code, and were
#     kept from being flagged only by the 0.2s floor, which is 7-13% of a dump
#     here. So the floor is what makes 5% usable, and a single flagged dump
#     result should be re-run before it is treated as a regression.
#     (Those 18 runs were the local run at 4 jobs. The current setup, at 2 jobs,
#     differed by -6.0% to +1.4% on local dump (the -6.0% was 0.1s), -0.8% to
#     +0.4% on local restore, +0.4% to +1.1% on S3 dump and -1.2% to +0.4% on S3
#     restore over three runs; its 2-job speedup over one job varied by about
#     0.1x between VMs, which is why it is shown and not gated.)
#   * Server and clients share the runner's 4 vCPUs, which are 2 physical
#     cores with 2 hyper-threads each. A worker costs about 1.4 cores (server
#     backend plus psql), so the speedup here is capped well below the number
#     of workers and says little about scaling on a dedicated database host.
#   * The S3 steps use a local versitygw, so they catch breakage and slowdowns
#     in the S3 read and write paths against a real S3 server, restore included.
#     The runner is CPU-bound there: Postgres, psql, the TLS and checksum work in
#     pgfanout and the S3 server all share the 2 physical cores, so a dump to S3
#     scales from 1 to 2 jobs (about 1.4x) and not beyond. A client-side cost that
#     the shared cores hide, such as boto3's trailing checksum removed in #19
#     (35-43% on a dedicated host), may not show: reverting it moved the S3 dump
#     by -1.4% with versitygw and by +0.9% to +2.7% with SeaweedFS. Check that
#     kind of change with bench.py --storage on a dedicated machine.
#   * The dataset is one plain 795 MB table with no indexes, so it does not
#     exercise index builds or many-table parallelism.
#
# When it runs
#   * on pull requests that touch the code (PR against its base branch);
#   * on every push to main that touches the code (the new commit against the
#     commit before the push), so a regression that slips in is caught and each
#     merge leaves a result in the run's artifacts;
#   * on demand (workflow_dispatch).
# There is deliberately no schedule trigger.
#
# It fails the job when a regression is found (the report is still written to
# the job summary, and uploaded, first). A manual run can turn that off with
# the "enforce" input. Whether a failed run also blocks merging is a branch
# protection setting: it does only if this check is made a required one.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'pyproject.toml'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bench/**'
      - 'pyproject.toml'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Git ref to compare against'
        default: origin/main
      size_mb:
        description: 'Approximate dataset size in MB'
        default: '1024'
      repeats:
        description: 'Measured rounds per variant'
        default: '5'
      threshold:
        description: 'Allowed slowdown, as a fraction (0.05 = 5%)'
        default: '0.05'
      enforce:
        description: 'Fail the job on a regression'
        type: boolean
        default: true

# A newer push to a pull request replaces its run, but runs on main are never
# cancelled by a later merge, so each merge keeps its own result (GitHub still
# keeps only one run waiting, so a burst of merges can skip an intermediate one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bench:
    name: pgfanout vs base (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
      SIZE_MB: ${{ inputs.size_mb || '1024' }}
      REPEATS: ${{ inputs.repeats || '5' }}
      THRESHOLD: ${{ inputs.threshold || '0.05' }}
      # Fail on a regression everywhere, except a manual run that turned it off.
      # (format() because a boolean false would fall through the || below.)
      ENFORCE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enforce) || 'true' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Resolve the base commit
        id: base
        run: |
          base="$BASE"
          # Only a push can legitimately lack a usable base: a push that creates
          # a branch has an all-zero "before", and a force push can leave
          # "before" unreachable. Compare with the parent in that case. For a
          # pull request or a manual run a missing base is a mistake, so fail
          # instead of quietly comparing against something else.
          if [ "$GITHUB_EVENT_NAME" = "push" ] \
             && { [ "$base" = "0000000000000000000000000000000000000000" ] \
                  || ! git cat-file -e "${base}^{commit}" 2>/dev/null; }; then
            base=HEAD^
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve the base commit '${BASE}' (event: ${GITHUB_EVENT_NAME})."
            exit 1
          fi
          echo "sha=$(git rev-parse "$base")" >> "$GITHUB_OUTPUT"

      - name: Install base and PR builds into separate virtualenvs
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add /tmp/base-src "$BASE_SHA"
          python3 -m venv /tmp/venv-base
          /tmp/venv-base/bin/pip install -q /tmp/base-src
          python3 -m venv /tmp/venv-pr
          /tmp/venv-pr/bin/pip install -q .

      - name: Run benchmark
        run: |
          python3 bench/bench.py \
            --variant base=pgfanout:/tmp/venv-base/bin \
            --variant pr=pgfanout:/tmp/venv-pr/bin \
            --variant pg_dump-j1=pgdump@1 \
            --size-mb "$SIZE_MB" --repeats "$REPEATS" --jobs-sweep 1,2 \
            --out bench-results.json

      - name: Compare and report
        if: ${{ !cancelled() && hashFiles('bench-results.json') != '' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          {
            echo "Comparing base \`${BASE_SHA:0:7}\` with head \`$(git rev-parse --short HEAD)\` (${GITHUB_EVENT_NAME})."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          fail=""
          if [ "$ENFORCE" = "true" ]; then fail="--fail"; fi
          echo "Fail on regression: ${ENFORCE}." >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 bench/compare.py bench-results.json \
            --base base@2 --pr pr@2 --reference pg_dump-j1 --single pr@1 \
            --threshold "$THRESHOLD" $fail | tee report.md
          status=${PIPESTATUS[0]}
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            what=$(grep -m1 'Possible regression' report.md | sed 's/\*//g')
            echo "::error title=Benchmark::${what:-compare.py failed} See the job summary."
          fi
          exit $status

      # The same dump and restore, through S3. pgfanout talks to a local
      # versitygw (a POSIX-backed S3 gateway) over HTTPS: boto3 only wraps each
      # part in its trailing-checksum encoding over TLS, which is the slowdown
      # #19 removed. It was picked because it needs about a third of the CPU of
      # SeaweedFS (2 against 5-6 CPU-seconds per dump of the 795 MB table), and
      # the runner has only 2 physical cores, shared with Postgres. The release
      # is pinned and checked against its SHA-256. Like the steps above, this
      # runs even if an earlier one failed.
      - name: Start a local S3 server (versitygw)
        if: ${{ !cancelled() }}
        run: |
          mkdir /tmp/vgw && cd /tmp/vgw
          curl -fsSL -o vgw.tar.gz \
            https://github.com/versity/versitygw/releases/download/v1.11.0/versitygw_v1.11.0_Linux_x86_64.tar.gz
          echo "1f075c9dc92fef232f5b3c7465711ddc5e1b062b2b6df4a3bd246a4be5b35b52  vgw.tar.gz" \
            | sha256sum -c -
          tar xzf vgw.tar.gz
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout key.pem -out cert.pem \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" 2>/dev/null
          sudo install -d -o "$USER" /mnt/vgw
          nohup /tmp/vgw/versitygw_v1.11.0_Linux_x86_64/versitygw \
            --access bench --secret bench --cert /tmp/vgw/cert.pem --key /tmp/vgw/key.pem \
            --port 127.0.0.1:8333 posix /mnt/vgw > /tmp/vgw/log.txt 2>&1 &
          for _ in $(seq 1 60); do
            curl -sk --max-time 2 -o /dev/null https://127.0.0.1:8333/ && exit 0
            sleep 1
          done
          echo "::error::versitygw did not start"; tail -30 /tmp/vgw/log.txt; exit 1

      - name: Run S3 benchmark
        if: ${{ !cancelled() }}
        env:
          AWS_ENDPOINT_URL_S3: https://127.0.0.1:8333
          AWS_S3_VERIFY_SSL: /tmp/vgw/cert.pem
          AWS_ACCESS_KEY_ID: bench
          AWS_SECRET_ACCESS_KEY: bench
          AWS_REGION: us-east-1
        run: |
          /tmp/venv-pr/bin/python -c "
          import boto3, os
          boto3.client('s3', endpoint_url=os.environ['AWS_ENDPOINT_URL_S3'],
                       verify=os.environ['AWS_S3_VERIFY_SSL']).create_bucket(Bucket='bench')"
          /tmp/venv-pr/bin/python bench/bench.py \
            --variant base=pgfanout:/tmp/venv-base/bin \
            --variant pr=pgfanout:/tmp/venv-pr/bin \
            --storage s3://bench/ci \
            --size-mb "$SIZE_MB" --repeats "$REPEATS" --jobs-sweep 1,2 \
            --out bench-results-s3.json

      - name: S3 server log
        if: ${{ failure() }}
        run: tail -40 /tmp/vgw/log.txt || true

      - name: Compare and report (S3)
        if: ${{ !cancelled() && hashFiles('bench-results-s3.json') != '' }}
        run: |
          fail=""
          if [ "$ENFORCE" = "true" ]; then fail="--fail"; fi
          set +e
          python3 bench/compare.py bench-results-s3.json --base base@2 --pr pr@2 \
            --single pr@1 \
            --title "pgfanout benchmark, S3 (versitygw over HTTPS)" \
            --threshold "$THRESHOLD" $fail | tee report-s3.md
          status=${PIPESTATUS[0]}
          cat report-s3.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            what=$(grep -m1 'Possible regression' report-s3.md | sed 's/\*//g')
            echo "::error title=S3 benchmark::${what:-compare.py failed} See the job summary."
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench-results.json
            report.md
            bench-results-s3.json
            report-s3.md
